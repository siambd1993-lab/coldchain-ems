###############################################################################
# ColdChain EMS — Nginx site config (fronts php-fpm)
###############################################################################

# php-fpm upstream. `app` is the compose service name; :9000 is the fpm port.
upstream php_backend {
    server app:9000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # --- Body / timeouts -----------------------------------------------------
    # 25M upload limit mirrors php.ini upload_max_filesize (proof photos,
    # bulk-import CSVs). Keep in sync with post_max_size.
    client_max_body_size 30m;
    client_body_timeout 60s;
    keepalive_timeout 30s;
    sendfile on;
    tcp_nopush on;

    # --- Security headers (defence in depth; API is JSON-only) ---------------
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # --- Gzip ----------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types application/json application/javascript text/plain text/css application/xml;

    # --- Real client IP (behind Cloudflare / ALB) ----------------------------
    # The app trusts X-Forwarded-* via TrustProxies; pass through what we get.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # --- Health check (Laravel /up) ------------------------------------------
    location = /up {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    # --- Front controller ----------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- PHP -----------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_backend;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";  # mitigate httpoxy

        # Streaming reports / long AI calls: give fpm room before 504.
        fastcgi_read_timeout 65s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # --- Deny access to hidden & sensitive files -----------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(env|log|sqlite|ini|lock|yml|yaml)$ {
        deny all;
    }
}
