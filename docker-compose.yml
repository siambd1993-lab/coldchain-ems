###############################################################################
# ColdChain EMS — local development stack
#
#   docker compose up -d --build
#   docker compose exec app php artisan migrate --seed
#
# Services:
#   nginx      → public HTTP entry (http://localhost:8080)
#   app        → PHP 8.4-FPM (Laravel API)         [role: app]
#   worker     → queue worker (redis)              [role: worker]
#   scheduler  → cron loop (schedule:work)         [role: scheduler]
#   mysql      → MySQL 8 primary
#   redis      → cache / queue / session store
#   emqx       → MQTT broker for IoT telemetry ingest
#   mailpit    → catches outbound mail in dev (http://localhost:8025)
#   adminer    → lightweight DB UI (http://localhost:8081)
###############################################################################

x-app-image: &app-image
  build:
    context: .
    dockerfile: infra/php/Dockerfile
  image: coldchain/api:dev

x-app-env: &app-env
  APP_ENV: local
  APP_DEBUG: "true"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: coldchain
  DB_USERNAME: coldchain
  DB_PASSWORD: secret
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  MQTT_HOST: emqx
  MQTT_PORT: "1883"
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Share the app code so nginx can serve static assets under public/.
      - ./backend:/var/www/html
    networks: [coldchain]
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: ../infra/admin/Dockerfile
    image: coldchain/admin:dev
    ports:
      - "5173:5173"
    volumes:
      - ./admin:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api/v1
    networks: [coldchain]
    restart: unless-stopped

  app:
    <<: *app-image
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      CONTAINER_ROLE: app
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
      # Keep vendor/ inside the container layer (host bind would shadow it).
      - /var/www/html/vendor
    networks: [coldchain]
    restart: unless-stopped

  worker:
    <<: *app-image
    depends_on:
      app:
        condition: service_started
    environment:
      <<: *app-env
      CONTAINER_ROLE: worker
      QUEUE_NAMES: billing,notifications,telemetry,reports,default
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    networks: [coldchain]
    restart: unless-stopped

  scheduler:
    <<: *app-image
    depends_on:
      app:
        condition: service_started
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    networks: [coldchain]
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_DATABASE: coldchain
      MYSQL_USER: coldchain
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "33060:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [coldchain]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "63790:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [coldchain]
    restart: unless-stopped

  emqx:
    image: emqx/emqx:5.8
    environment:
      EMQX_NODE__COOKIE: coldchain-emqx
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public
    ports:
      - "1883:1883"    # MQTT
      - "8083:8083"    # MQTT over WebSocket
      - "18083:18083"  # Dashboard (http://localhost:18083, admin/public)
    volumes:
      - emqx-data:/opt/emqx/data
    networks: [coldchain]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"    # Web UI
      - "1025:1025"    # SMTP
    networks: [coldchain]
    restart: unless-stopped

  adminer:
    image: adminer:latest
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    networks: [coldchain]
    restart: unless-stopped

networks:
  coldchain:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  emqx-data:
